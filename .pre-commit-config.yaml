repos:
  # 1. isort
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort

  # 2. Black
  - repo: https://github.com/psf/black
    rev: 25.12.0
    hooks:
      - id: black

  # 3. Mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]

  # 4. Pylint
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        require_serial: true
        args: [
          "-rn", # Solo messaggi, niente report punteggio
          "-sn", # Niente score finale
          "--rcfile=pyproject.toml" # Usa la tua config esistente
        ]